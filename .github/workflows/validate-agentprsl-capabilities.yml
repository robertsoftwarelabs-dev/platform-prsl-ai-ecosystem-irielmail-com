name: Validate AgentPRSL-AI Capability Manifests

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - ".env.example"
      - ".gitignore"
      - "docs/architecture/**"
      - "src/components/site/**"
      - "src/i18n/**"
      - "src/lib/ai/**"
      - "src/lib/permission-manager/**"
      - "src/routes/**"
      - "src/test/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "nitro.config.ts"
      - ".github/workflows/validate-agentprsl-capabilities.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - ".env.example"
      - ".gitignore"
      - "docs/architecture/**"
      - "src/components/site/**"
      - "src/i18n/**"
      - "src/lib/ai/**"
      - "src/lib/permission-manager/**"
      - "src/routes/**"
      - "src/test/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "nitro.config.ts"
      - ".github/workflows/validate-agentprsl-capabilities.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-capability-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate architecture documentation links
        run: python docs/architecture/scripts/validate_architecture_links.py
      - name: Install validator dependency
        run: python -m pip install -r docs/architecture/agent-prsl-ai/requirements-dev.txt
      - name: Validate manifests
        run: python docs/architecture/agent-prsl-ai/scripts/validate_capability_manifests.py
      - name: Validate Permission Manager contracts
        run: python docs/architecture/agent-prsl-ai/scripts/validate_permission_manager.py
      - name: Validate execution and authorization contract
        run: python docs/architecture/agent-prsl-ai/scripts/validate_execution_contract.py
      - name: Validate Dependency Resolver contract
        run: python docs/architecture/agent-prsl-ai/scripts/validate_dependency_resolver.py

  application-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run application and Permission Manager tests
        run: bun run test
      - name: Type-check the application
        run: bunx tsc --noEmit
      - name: Build the platform application
        run: bun run build
      - name: Smoke-test portable Node server
        run: |
          set -euo pipefail
          PORT=4179 HOST=127.0.0.1 node .output/server/index.mjs > /tmp/prsl-nitro.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4179/ -o /tmp/prsl-home.html; then
              test -s /tmp/prsl-home.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prsl-nitro.log
          exit 1
      - name: Lint local-only Agent and public API routes
        run: bunx eslint src/components/site/AgentConsole.tsx src/routes/api/public/v1/inference.ts src/routes/api/public/v1/capabilities.ts
      - name: Lint the Permission Manager implementation
        run: bunx eslint src/lib/permission-manager/*.ts src/test/permission-manager/*.test.ts
      - name: Upload verified Nitro build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prsl-ai-ecosystem-platform-${{ github.sha }}
          path: .output/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
